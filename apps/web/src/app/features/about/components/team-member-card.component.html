<article class="team-member">
  <div class="team-member__portrait">
    @if (member().portrait; as portrait) {
      <img
        [src]="portrait.src"
        [alt]="portrait.alt"
        [style.object-position]="portrait.objectPosition ?? 'center'"
      />
    } @else {
      <div class="team-member__placeholder" aria-hidden="true">
        <span class="team-member__number">{{ member().name[0] }}</span>
        <span>Portrait coming soon</span>
      </div>
    }
  </div>
  <div class="team-member__details">
    <h3>{{ member().name }}</h3>
    <p>{{ member().role }}</p>
  </div>
</article>
